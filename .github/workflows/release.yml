# Monami for Mac, Windows and Android (ADR-0046, ADR-0047), released from the public repository
# Narikia1/monami-apps: public repositories build on macOS and Windows at no
# cost. Builds apps/desktop of a given commit of Narikia1/monami (read with a
# read-only deploy key), tests the app on each system against
# monami.narikia.com, and publishes the installers with latest.json, which the
# download page and the apps read. Started by hand with the commit to build.
#
# Source of truth: infra/apps-release in Narikia1/monami, copied here by
# `scripts/provision-cloud.sh apps`.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Narikia1/monami to build
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Mac
            os: macos-15
            task: dist:mac
            file: Monami-mac.dmg
          - name: Windows
            os: windows-2025
            task: dist:win
            file: Monami-Setup.exe
    runs-on: ${{ matrix.os }}
    # Apple's notarization can take hours, above all for a new account. 350 is close to GitHub's limit.
    timeout-minutes: 350
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Narikia1/monami
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.MONAMI_SOURCE_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@monami/desktop..."
      - id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: pnpm --filter @monami/desktop test
      - name: The app on this system, against monami.narikia.com
        run: pnpm --filter @monami/desktop test:e2e
      - name: Apple's key for notarizing
        if: matrix.name == 'Mac'
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # The signing secrets reach only this step, after the tests.
      - name: Installer (Mac, signed and notarized)
        if: matrix.name == 'Mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @monami/desktop run ${{ matrix.task }}
      - name: Installer (Windows)
        if: matrix.name == 'Windows'
        run: pnpm --filter @monami/desktop run ${{ matrix.task }}
      - name: Apple accepts the app
        if: matrix.name == 'Mac'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          app=apps/desktop/release/mac-universal/Monami.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app" | grep -q com.apple.security.device.camera
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/desktop/release/${{ matrix.file }}
          if-no-files-found: error

  # The same release carries Android's copy for monami.narikia.com/download/android: signed with the upload key,
  # so it installs without Google Play (whose automatic protection would send people to the store).
  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Narikia1/monami
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.MONAMI_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: The upload key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
      - name: Test and build
        working-directory: apps/android
        env:
          MONAMI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          export MONAMI_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          version=$(node -p "require('../desktop/package.json').version")
          # 1.2.3 becomes 10203: each release installs over the one before.
          code=$(node -p "'$version'.split('.').reduce((n, part) => n * 100 + Number(part), 0)")
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PmonamiVersionCode="$code" -PmonamiVersionName="$version"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Monami-Android.apk"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Android
          path: ${{ runner.temp }}/Monami-Android.apk
          if-no-files-found: error

  publish:
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release with latest.json and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE: ${{ inputs.ref }}
        working-directory: out
        run: |
          jq -n --arg v "$VERSION" --argjson mac "$(stat -c %s Monami-mac.dmg)" --argjson win "$(stat -c %s Monami-Setup.exe)" --argjson android "$(stat -c %s Monami-Android.apk)" \
            '{version: $v, mac: {file: "Monami-mac.dmg", size: $mac}, windows: {file: "Monami-Setup.exe", size: $win}, android: {file: "Monami-Android.apk", size: $android}}' > latest.json
          sha256sum Monami-mac.dmg Monami-Setup.exe Monami-Android.apk > SHA256SUMS.txt
          gh release create "v$VERSION" Monami-mac.dmg Monami-Setup.exe Monami-Android.apk latest.json SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Monami $VERSION" \
            --notes "Monami $VERSION for Mac (macOS 12 or later, Apple silicon and Intel), Windows (10 or 11, 64-bit) and Android (8 or later), built from Narikia1/monami ${SOURCE:0:12}. Download at https://monami.narikia.com/download."
