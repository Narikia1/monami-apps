# Monami for iPhone and iPad to TestFlight (ADR-0053). Started by hand with the
# commit to build. An App Store certificate and profile sign it, which need no
# registered device; the App Store Connect key uploads it.
#
# Source of truth: infra/apps-release in Narikia1/monami, copied here by
# `scripts/provision-cloud.sh apps`.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Narikia1/monami to build
        required: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Narikia1/monami
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.MONAMI_SOURCE_KEY }}
          persist-credentials: false
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Apple's key, certificate and profile
        shell: bash
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            printf '%s' "$PROFILE" | base64 --decode > "$dir/monami-app-store.mobileprovision"
          done
      - name: Archive
        working-directory: apps/ios
        shell: bash
        run: |
          xcodebuild archive -project Monami.xcodeproj -scheme Monami -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Monami.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" 2>&1 | grep -E "error:|\*\* ARCHIVE" || true
          test -d "$RUNNER_TEMP/Monami.xcarchive"
      - name: Upload
        working-directory: apps/ios
        shell: bash
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>2H85A93LC9</string>
            <key>provisioningProfiles</key><dict><key>com.narikia.monami</key><string>Monami App Store</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Monami.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | grep -E "error:|Upload|EXPORT|\*\*"
      - name: Remove Apple's key and the certificate
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
